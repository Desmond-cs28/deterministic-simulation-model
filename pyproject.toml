[project]
name = "registration-sim"
version = "1.0.0"
description = "Deterministic Python simulation of course registration at Palm University College"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
registration-sim = "registration_sim.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
